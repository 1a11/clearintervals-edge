# Modules stay disabled until TLS material and writer credentials are installed.
# Clear Intervals generates a prefilled config.yaml during gateway setup (Gateway Setup Wizard, Step 1).
# Use this example only when you write the file by hand. With bindings: [], the gateway fills its
# bindings automatically from the cloud stream descriptors behind your PromQL after enrollment.
stateDir: /var/lib/edgegateway
deploymentLicensePath: /var/lib/edgegateway/enrollment/license.json
statusListen: 127.0.0.1:9081
# verbose: true writes detailed, unredacted diagnostics (tokens, stream keys, labels, sample values).
# It is for debugging a writer or the uplink; keep it off in production.
verbose: false
buffer:
  maxBytes: 10737418240
  maxAgeDays: 7
  maxSegments: 100000
modules:
  remoteWrite:
    enabled: false
    listen: 127.0.0.1:2948
    certificate: ""
    key: ""
    writerCa: ""
    principals: []
  captures:
    enabled: false
    listen: 127.0.0.1:8430
    certificate: ""
    key: ""
    writerCa: ""
    principals: []
uplink:
  forceTcp: false
  proxy: ""
bindings: []
