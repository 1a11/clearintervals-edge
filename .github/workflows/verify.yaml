name: Verify edge gateway
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: edgegateway-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install grpcio-tools==1.84.0
      - run: make verify build
      - run: go test -tags=integration -run='^TestStressRateCriterion$' ./integration
      - run: make generate vectors && git diff --exit-code
      - run: make fuzz
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: docker build -t edgegateway:verify .
      - run: docker run --rm edgegateway:verify -help
      - run: CGO_ENABLED=0 go test -c -o bin/buffer-tests ./internal/buffer
      - name: Exercise actual ENOSPC with a read-only non-root container
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=512m --cpus=1 --tmpfs /tmp:rw,size=1m,uid=65532,gid=65532,mode=0700 \
            -e EDGE_TEST_ENOSPC_ROOT=/tmp/queue -v "$PWD/bin/buffer-tests:/buffer-tests:ro" \
            --entrypoint /buffer-tests edgegateway:verify -test.run '^TestRealENOSPC$' -test.v
