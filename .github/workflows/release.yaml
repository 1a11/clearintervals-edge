name: Release edge gateway image
on:
  # Only main publishes. Deployments verify this workflow identity on refs/heads/main.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact repository commit to verify and publish (empty uses main)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: edgegateway-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
    steps:
      - name: Validate immutable source revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source to the authorized workflow branch
        run: git merge-base --is-ancestor HEAD "origin/${GITHUB_REF#refs/heads/}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install grpcio-tools==1.84.0
      - run: make verify build
      - run: go test -tags=integration -run='^$' ./integration
      - run: make generate vectors && git diff --exit-code
      - run: make fuzz
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Install pinned cosign 3.1.4
        run: |
          curl --fail --location --retry 3 https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 -o "$RUNNER_TEMP/cosign"
          printf '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  %s\n' "$RUNNER_TEMP/cosign" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build immutable image with SBOM and provenance
        id: image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.revision || github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          target="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --push --provenance=mode=max --sbom=true \
            --build-arg "VERSION=$SOURCE_SHA" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$target:sha-$SOURCE_SHA" --metadata-file image-metadata.json .
          digest=$(python3 -c "import json; print(json.load(open('image-metadata.json'))['containerimage.digest'])")
          echo "ref=$target@$digest" >> "$GITHUB_OUTPUT"
      - name: Scan exact image and export CycloneDX SBOM
        env:
          REF: ${{ steps.image.outputs.ref }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$REF"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image \
            --format cyclonedx "$REF" > sbom.cdx.json
      - name: Sign and verify the scanned digest
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yaml@$GITHUB_REF" \
            "$REF" > signature-verification.json
          docker buildx imagetools inspect "$REF" --raw > image-index.json
          printf '%s\n' "$REF" > image-digest.txt
          printf 'Verified image: `%s`\n' "$REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: edgegateway-release-${{ inputs.revision || github.sha }}
          path: |
            image-digest.txt
            image-metadata.json
            image-index.json
            sbom.cdx.json
            signature-verification.json
          if-no-files-found: error
      - name: Publish public downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.revision || github.sha }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$SOURCE_SHA"
          docker pull "$REF"
          docker tag "$REF" "$target"
          docker save "$target" | gzip > edgegateway-image.tar.gz
          cp bin/edgegateway edgegateway-linux-amd64
          sha256sum edgegateway-linux-amd64 edgegateway-image.tar.gz image-digest.txt sbom.cdx.json signature-verification.json > SHA256SUMS
          tag="build-$SOURCE_SHA"
          printf 'Linux amd64 build from commit `%s`.\n\nDownload the image archive and SHA256SUMS, check the checksum, then load it with docker load. See the README for setup.\n' "$SOURCE_SHA" > release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Edge gateway $SOURCE_SHA" --notes-file release-notes.md --latest \
            edgegateway-linux-amd64 edgegateway-image.tar.gz SHA256SUMS image-digest.txt sbom.cdx.json signature-verification.json
